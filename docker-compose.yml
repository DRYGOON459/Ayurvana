version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ayurvana-postgres
    restart: always
    environment:
      POSTGRES_DB: ayurvana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ayurvana"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ayurvana-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ayurvana.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
